name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'cremson-next-ui/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'cremson-next-ui/package-lock.json'

      - name: Install dependencies
        run: |
          cd cremson-next-ui
          npm ci

      - name: Build Next.js app for Edge
        run: |
          cd cremson-next-ui
          npx @cloudflare/next-on-pages

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 'c9129fabb1b21f3171d4a3285661b0ed'
          projectName: 'cremson-baserow-dev'
          directory: 'cremson-next-ui/.vercel/output/static'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
